<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Viagem de Chihiro</title>
    <link rel="stylesheet" href="src/css/style.css">
    <link rel="shortcut icon" href="src/img/ilustração.png" type="image/x-icon">
</head>

    body {
        background-image: url(src/img/background.png);
        background-repeat: no-repeat;

        background-size: cover;
    }
</style> -->

<body>
    <header>
        <div class="cabecalho">
            <div class="logo">
                <figure>
                    <img src="src/img/logo.png" alt="Studio Ghibli">
                </figure>
            </div>
            <nav class="redes_sociais">
                <button class="google">
                    <a href="https://google.com" target="_blank">
                        <figure>
                            <img src="src/img/logo-google.png" alt="Logo da Google com cor de fundo branco">
                        </figure>
                    </a>
                </button>

                <button>
                    <a href="https://www.facebook.com/?locale=pt_BR" target="_blank">
                        <figure>
                            <img src="src/img/logo-facebook.png" alt="Logo do Facebook com cor de fundo branco">
                        </figure>
                    </a>
                </button>

                <button>
                    <a href="https://x.com/?lang=pt" target="_blank">
                        <figure>
                            <img src="src/img/logo-twitter.png"
                                alt="Logo do Twitter (atualmente conhecido por X) com cor de fundo branco">
                        </figure>
                    </a>
                </button>

                <button>
                    <a href="https://www.instagram.com/" target="_blank">
                        <figure>
                            <img src="src/img/logo-instagram.png" alt="Logo do Instagram com cor de fundo branco">
                        </figure>
                    </a>
                </button>
            </nav>
        </div>
    </header>
    <main>
        <div class="principal">
            <div class="sobre">
                <h4>Hayao Miyazaki</h4>
                <h1>A Viagem<br>de Chihiro</h1>
                <p>Chihiro chega a um mundo mágico dominado por uma bruxa. Aqueles que a desobedecem são
                    transformados em animais.</p>
                <div class="botoes">
                    <a href="https://www.netflix.com/br/title/60023642" class="assistir_now">
                        <figure>
                            <img src="src/img/play.png" alt="Símbolo de play">
                        </figure>
                        <h3> Assistir agora</h3>
                    </a>
                    <a href="https://www.youtube.com/watch?v=SgZI655GgHk" class="assistir_trailer">
                        <h3>Assistir trailer</h3>
                    </a>
                </div>
            </div>

            <div class="imagem">
                <figure>
                    <img src="src/img/ilustração.png" alt="Dois espíritos Kaonashi do filme A Viagem de Chihiro">
                </figure>
            </div>
        </div>
    </main>
</body>

</html>
